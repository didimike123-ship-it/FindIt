<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FindIt — Log In</title>
<script>if(localStorage.getItem('findit2_theme')==='dark')document.documentElement.classList.add('dark')</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="login.css"/>
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem">

  <div class="form-card" style="max-width:400px;width:100%">
    <div class="logo" style="text-align:center;font-size:1.5rem;margin-bottom:.15rem">Find<span>It</span></div>
    <div class="logo-sub" style="text-align:center;margin-bottom:1.5rem">Lost &amp; Found System</div>

    <div class="type-tabs">
      <button class="type-tab active is-auth" id="tab-login" onclick="setAuthTab('login')">Log In</button>
      <button class="type-tab is-auth" id="tab-signup" onclick="setAuthTab('signup')">Sign Up</button>
    </div>

    <div id="login-fields">
      <div class="field">
        <label>Phone Number or Email <span class="req">*</span></label>
        <input class="input" type="text" id="li-contact" placeholder="e.g. 09123456789 or you@example.com" onkeydown="focusNext(event,'li-pw')"/>
      </div>
      <div class="field">
        <label>Password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="li-pw" placeholder="Enter your password" onkeydown="submitOnEnter(event,doLogin)"/>
          <button type="button" class="pw-toggle" onclick="togglePw('li-pw',this)">👁️</button>
        </div>
      </div>
      <button class="submit-btn" onclick="doLogin()">Log In</button>
    </div>

    <div id="signup-fields" style="display:none">
      <div class="field">
        <label>Name <span class="req">*</span></label>
        <input class="input" type="text" id="su-name" placeholder="Your full name" onkeydown="focusNext(event,'su-contact')"/>
      </div>
      <div class="field">
        <label>Phone Number or Email <span class="req">*</span></label>
        <input class="input" type="text" id="su-contact" placeholder="e.g. 09123456789 or you@example.com" onkeydown="focusNext(event,'su-pw')"/>
      </div>
      <div class="field">
        <label>Password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="su-pw" placeholder="Choose a password" onkeydown="focusNext(event,'su-pw2')"/>
          <button type="button" class="pw-toggle" onclick="togglePw('su-pw',this)">👁️</button>
        </div>
      </div>
      <div class="field">
        <label>Confirm Password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input class="input" type="password" id="su-pw2" placeholder="Re-enter password" onkeydown="submitOnEnter(event,doSignup)"/>
          <button type="button" class="pw-toggle" onclick="togglePw('su-pw2',this)">👁️</button>
        </div>
      </div>
      <button class="submit-btn" onclick="doSignup()">Create Account</button>
    </div>

    <div style="text-align:center;margin-top:1.25rem;padding-top:1.1rem;border-top:1px solid var(--border)">
      <button class="btn btn-outline btn-sm" onclick="continueAsGuest()" style="width:100%;justify-content:center">👤 Continue as Guest</button>
      <div style="font-size:.72rem;color:var(--muted);margin-top:.5rem">You can browse posts as a guest, but reporting items and saving history need an account.</div>
    </div>
  </div>

<script src="script.js"></script>
<script>
// Already logged in? Skip straight to Home.
if(getSession()) window.location.href='index.html';
</script>
</body>
</html>

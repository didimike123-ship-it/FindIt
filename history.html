<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FindIt — My Reports History</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="logo">Find<span>It</span></div>
      <div class="logo-sub">Lost &amp; Found System</div>
    </div>
    <nav class="nav">
      <a class="nav-item" href="home.html"><span class="nav-icon">🏠</span> Home</a>
      <a class="nav-item" href="report.html"><span class="nav-icon">✏️</span> Report Item</a>
      <a class="nav-item active" href="history.html"><span class="nav-icon">🕘</span> History</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="content">
    <div class="topbar">
      <span class="topbar-title">My Reports History</span>
      <div class="topbar-right">
        <span class="topbar-user" id="user-name-top"></span>
        <button class="btn btn-outline btn-sm" onclick="logout()">Log out</button>
        <a class="btn btn-primary btn-sm" href="report.html">+ Report Item</a>
      </div>
    </div>

    <div class="inner">
      <div class="page-head">
        <h2>My Reports History</h2>
      </div>
      <p style="font-size:.85rem;color:var(--muted);margin:-.75rem 0 1.25rem">Items you've reported from this device — Lost, Found, and Recovered.</p>
      <div class="items-grid" id="grid-history"></div>
    </div><!-- /inner -->
  </div><!-- /content -->
</div><!-- /app -->

<!-- MOBILE NAV -->
<div class="mobile-nav">
  <div class="mobile-nav-inner">
    <a class="mob-btn" href="home.html"><span class="m-ico">🏠</span>Home</a>
    <a class="mob-btn" href="report.html"><span class="m-ico">✏️</span>Report</a>
    <a class="mob-btn active" href="history.html"><span class="m-ico">🕘</span>History</a>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" style="display:none" onclick="closeOuter(event)">
  <div class="modal">
    <div class="modal-hdr">
      <h3 id="m-name"></h3>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-img" id="m-img"></div>
      <div class="detail-table" id="m-details"></div>
      <div class="contact-box" id="m-contact"></div>
      <div class="modal-actions" id="m-actions"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
const _session=requireLogin();
if(_session){document.getElementById('user-name-top').textContent='Hi, '+_session.name;initHistoryPage();}
</script>
</body>
</html>
